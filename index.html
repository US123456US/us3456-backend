<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US123456US</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 30px 24px;
      text-align: center;
      max-width: 600px;
    }
    h1 { margin-bottom: 12px; }
    p { color: #dbeafe; line-height: 1.8; }
    button {
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>US123456US</h1>
    <p>欢迎来到我的个人主页。</p>
    <p>这是一个 GitHub Pages 站点，已成功部署。</p>
    <button onclick="document.getElementById('msg').textContent='欢迎访问我的主页！'">点击我</button>
    <p id="msg"></p>
  </div>
</body>
</html>
